name: Trace Preview Validate

on:
  push:
    branches:
      - feature/trace-architecture-foundation-2026-08-01
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install Worker dependencies
        run: npm ci
      - name: Check Worker module syntax
        run: |
          cp src/trace-v1-project-approvals-api.js /tmp/trace-v1-project-approvals-api.mjs
          cp src/preview-command-entry.js /tmp/preview-command-entry.mjs
          node --check /tmp/trace-v1-project-approvals-api.mjs
          node --check /tmp/preview-command-entry.mjs
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
