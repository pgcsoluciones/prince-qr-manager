name: Deploy INTAP Trace Promo Demo

on:
  push:
    branches:
      - demo/intap-trace-promo-2026-08-03
    paths:
      - "trace-promo-demo/**"
      - ".github/workflows/deploy-trace-promo-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-demo:
    name: Build and deploy isolated demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trace-promo-demo

    steps:
      - name: Checkout demo branch
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: trace-promo-demo/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build demo
        run: npm run build

      - name: Ensure isolated Cloudflare Pages project exists
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create intap-trace-promo-demo --production-branch demo/intap-trace-promo-2026-08-03 || true

      - name: Deploy demo to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=intap-trace-promo-demo --branch=demo/intap-trace-promo-2026-08-03
          workingDirectory: trace-promo-demo
